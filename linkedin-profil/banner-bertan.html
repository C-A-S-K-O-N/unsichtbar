<!doctype html><html><head><meta charset="utf-8">
<!-- LinkedIn-Titelbild Bertan Findik, 1584 x 396, Stil der Website digital-only.ch. Profilfoto verdeckt unten links ca. 0-480 px: dort kein Text. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1584px;height:396px;overflow:hidden;background:#f8f8f8;font-family:Inter,sans-serif;color:#0a0a0c;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
#glow{inset:0;background:radial-gradient(420px 320px at 16% 50%,rgba(13,59,139,.10),transparent 70%)}
#txt{left:540px;top:58px;width:900px}
.eye{font:500 21px Inter;color:#0d3b8b;letter-spacing:-.005em}
h1{font:800 64px/1.0 'Inter Tight',Inter,sans-serif;letter-spacing:-.05em;margin-top:12px}
.h2{font:700 33px/1.15 'Inter Tight',Inter,sans-serif;letter-spacing:-.03em;margin-top:8px}
.h2 span{color:#0d3b8b}
.sub{font:400 20px/1.4 Inter;color:#5b6270;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:10px;border-radius:999px;background:#0d3b8b;color:#fff;font:600 19px Inter;padding:12px 22px;margin-top:22px}

</style></head><body>
<div class="abs" id="glow"></div>
<canvas id="sph" class="abs" width="900" height="900" style="left:20px;top:-32px;width:460px;height:460px"></canvas>
<div class="line" style="left:560px;right:56px;top:40px;background:transparent"></div>
<div class="abs" id="txt">
 <div class="eye">Bertan Findik · Partner bei digitalONLY AG, Zug</div>
 <h1>Gefunden werden.</h1>
 <div class="h2">Auf Google Maps, in der Google-Suche und <span>in ChatGPT.</span></div>
 <div class="sub">Für Arztpraxen, Apotheken und lokale Betriebe in der Schweiz.</div>
 <div class="pill">digital-only.ch <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
</div>
<img id="logo" class="abs" src="logo.png" alt="digitalONLY">
<script>
// Partikel-Kugel wie auf der Website (statisch): Fibonacci-Punkte, Tiefe über Grösse und Deckkraft
const c=document.getElementById('sph'),x=c.getContext('2d'),N=700,R=300,cx=450,cy=450,ry=.6,rx=-.35;
for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=i*Math.PI*(3-Math.sqrt(5));let X=Math.cos(a)*r,Y=y,Z=Math.sin(a)*r;
 let X1=X*Math.cos(ry)+Z*Math.sin(ry),Z1=-X*Math.sin(ry)+Z*Math.cos(ry);let Y2=Y*Math.cos(rx)-Z1*Math.sin(rx),Z2=Y*Math.sin(rx)+Z1*Math.cos(rx);
 const d=(Z2+1)/2;x.fillStyle=`rgba(13,59,139,${(.12+.6*d).toFixed(3)})`;x.beginPath();x.arc(cx+X1*R,cy+Y2*R,1.6+3.4*d,0,7);x.fill()}
</script></body></html>
